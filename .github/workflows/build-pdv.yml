name: Build PDV Desktop

# Manual — dispara pelo botão "Run workflow" na aba Actions do GitHub.
# Precisa cross-compilar Windows num runner Windows de verdade (não dá
# pra gerar .msi/.exe direto de um Mac), então usa matrix macOS + Windows.
on:
  workflow_dispatch:

jobs:
  build:
    # GITHUB_TOKEN vem só com leitura por padrão — sem isso o tauri-action
    # não consegue criar a Release (erro "Resource not accessible by
    # integration" ao tentar publicar).
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: mac
          - platform: windows-latest
            label: windows

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instala dependências do frontend
        working-directory: dudu-bebidas/pdv-desktop
        run: npm install

      # Vite embute essas variáveis no build — sem elas o app não conecta
      # no Supabase certo. Cadastre os 3 segredos no repo antes de rodar
      # (Settings → Secrets and variables → Actions), copiando de
      # dudu-bebidas/pdv-desktop/.env local.
      - name: Escreve o .env do build
        working-directory: dudu-bebidas/pdv-desktop
        shell: bash
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.PDV_VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_KEY=${{ secrets.PDV_VITE_SUPABASE_KEY }}" >> .env
          echo "VITE_STORE_SLUG=${{ secrets.PDV_VITE_STORE_SLUG }}" >> .env

      # Publica automaticamente uma GitHub Release com os instaladores +
      # o latest.json assinado (o PDV já instalado consulta esse arquivo
      # sozinho — ver plugins.updater.endpoints em tauri.conf.json — e
      # se avisa quando tem versão nova, sem precisar reinstalar na mão).
      # Os dois SOs da matrix publicam na MESMA release (mesma tag),
      # suportado nativamente pelo tauri-action.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: dudu-bebidas/pdv-desktop
          tagName: pdv-v__VERSION__
          releaseName: "PDV Dudu Bebidas v__VERSION__"
          releaseBody: "Atualização do PDV — instale manualmente aqui, ou deixe o app já instalado se atualizar sozinho."
          releaseDraft: false
          prerelease: false

  # O repositório é privado — GitHub bloqueia download anônimo de asset
  # de Release em repo privado, então o PDV já instalado nunca conseguia
  # enxergar o latest.json (era por isso que o auto-update não avisava
  # nada). Esse job espelha só os arquivos JÁ COMPILADOS (nunca o código)
  # pra um bucket público do Supabase Storage, de onde o updater
  # realmente consegue baixar sem login.
  mirror-to-storage:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descobre a versão publicada
        id: version
        run: |
          VERSION=$(grep -m1 '"version"' dudu-bebidas/pdv-desktop/src-tauri/tauri.conf.json | sed -E 's/.*"version": *"([^"]+)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Baixa os arquivos da Release recém-publicada
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "pdv-v${{ steps.version.outputs.version }}" --dir ./release-assets --repo ${{ github.repository }}

      - name: Reescreve as URLs do latest.json pro Storage público
        run: |
          STORAGE_BASE="${{ secrets.PDV_VITE_SUPABASE_URL }}/storage/v1/object/public/pdv-releases"
          jq --arg base "$STORAGE_BASE" '
            .platforms |= with_entries(.value.url |= ($base + "/" + (. | split("/") | last)))
          ' ./release-assets/latest.json > ./release-assets/latest.json.tmp
          mv ./release-assets/latest.json.tmp ./release-assets/latest.json

      - name: Sobe os arquivos pro bucket público (pdv-releases)
        run: |
          BASE_URL="${{ secrets.PDV_VITE_SUPABASE_URL }}/storage/v1/object/pdv-releases"
          for file in ./release-assets/*; do
            name=$(basename "$file")
            echo "Subindo $name..."
            curl -sf -X POST "$BASE_URL/$name" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
              -H "x-upsert: true" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$file"
          done
