name: Build PDV Desktop

# Manual — dispara pelo botão "Run workflow" na aba Actions do GitHub.
# Precisa cross-compilar Windows num runner Windows de verdade (não dá
# pra gerar .msi/.exe direto de um Mac), então usa matrix macOS + Windows.
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: mac
          - platform: windows-latest
            label: windows

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instala dependências do frontend
        working-directory: dudu-bebidas/pdv-desktop
        run: npm install

      # Vite embute essas variáveis no build — sem elas o app não conecta
      # no Supabase certo. Cadastre os 3 segredos no repo antes de rodar
      # (Settings → Secrets and variables → Actions), copiando de
      # dudu-bebidas/pdv-desktop/.env local.
      - name: Escreve o .env do build
        working-directory: dudu-bebidas/pdv-desktop
        shell: bash
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.PDV_VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_KEY=${{ secrets.PDV_VITE_SUPABASE_KEY }}" >> .env
          echo "VITE_STORE_SLUG=${{ secrets.PDV_VITE_STORE_SLUG }}" >> .env

      # Publica automaticamente uma GitHub Release com os instaladores +
      # o latest.json assinado (o PDV já instalado consulta esse arquivo
      # sozinho — ver plugins.updater.endpoints em tauri.conf.json — e
      # se avisa quando tem versão nova, sem precisar reinstalar na mão).
      # Os dois SOs da matrix publicam na MESMA release (mesma tag),
      # suportado nativamente pelo tauri-action.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: dudu-bebidas/pdv-desktop
          tagName: pdv-v__VERSION__
          releaseName: "PDV Dudu Bebidas v__VERSION__"
          releaseBody: "Atualização do PDV — instale manualmente aqui, ou deixe o app já instalado se atualizar sozinho."
          releaseDraft: false
          prerelease: false
